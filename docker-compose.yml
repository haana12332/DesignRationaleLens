services:
  frontend:
    container_name: app-frontend
    build: ./frontend
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  backend:
    container_name: app-backend
    build: ./backend
    ports:
      - 3000:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    command: sh -c "npm install && npm run dev"