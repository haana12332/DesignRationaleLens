services:
  frontend:
    container_name: app-frontend
    build: ./frontend
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
  backend:
    container_name: app-backend
    build: ./backend
    ports:
      - 3000:3000
    volumes:
      - ./backend:/app
      - /app/node_modules